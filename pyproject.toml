[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "stochastic-llm"
version = "0.1.0"
description = "Train and evaluate language models as conditional numeric samplers."
requires-python = ">=3.10"
dependencies = [
  "numpy==2.2.6",
  "scipy==1.15.3",
  "PyYAML==6.0.2",
  "torch==2.8.0",
  "transformers==4.57.1",
  "peft==0.17.1",
  "accelerate==1.10.1",
  "safetensors==0.6.2",
  "wandb==0.31.0",
]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "ruff==0.14.5"]
analysis = ["matplotlib==3.11.2"]

[project.scripts]
stochastic-llm = "stochastic_llm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
