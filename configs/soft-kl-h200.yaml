model: Qwen/Qwen2.5-3B
revision: main
data_dir: data/numeric-v1
output_dir: outputs/qwen25-3b-soft-kl
method: soft_kl
seed: 42
device: cuda
precision: bf16
attention: sdpa
max_sequence_length: 128
max_steps: -1
num_train_epochs: 1
# Three independently sampled trie paths per configuration: 6,000 examples.
paths_per_config: 3
max_bins: 1001
decimals: 5
tail_probability: 0.001
trie_cache_size: 64
microbatch_size: 32
gradient_accumulation_steps: 1
eval_batch_size: 16
learning_rate: 0.0002
weight_decay: 0.01
warmup_ratio: 0.03
max_grad_norm: 1.0
lora_rank: 16
lora_alpha: 32
lora_dropout: 0.05
target_modules: [q_proj, k_proj, v_proj, o_proj]
logging_steps: 10
eval_steps: 50
save_steps: 50
save_total_limit: 3
dataloader_num_workers: 0
gradient_checkpointing: false
wandb:
  enabled: true
  mode: online
  entity: yash2007-university-of-washington
  project: stochastic-llm
  base_url: https://api.forge.coreweave.com
  directory: outputs/wandb
